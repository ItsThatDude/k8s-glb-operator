{{- if .Values.rbac.helpers.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "k8s-glb-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "k8s-glb-operator.resourceName" (dict "suffix" "cluster-editor-role" "context" $) }}
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - glb.antware.xyz
  resources:
  - clusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - glb.antware.xyz
  resources:
  - clusters/status
  verbs:
  - get
{{- end }}
