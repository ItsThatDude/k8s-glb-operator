apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-glb-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - glb.antware.xyz
  resources:
  - globalloadbalancers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - glb.antware.xyz
  resources:
  - globalloadbalancers/finalizers
  verbs:
  - update
- apiGroups:
  - glb.antware.xyz
  resources:
  - globalloadbalancers/status
  verbs:
  - get
  - patch
  - update
